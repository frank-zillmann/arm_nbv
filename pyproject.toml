[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arm_nbv"
version = "0.1.0"
description = "Learning next-best-view policies for a wrist-mounted camera on a robot arm to efficiently reconstruct novel scenes"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
